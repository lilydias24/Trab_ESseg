---
# Plano de automacao ZAP - Etapa 5 (Trab_ESseg / SIGH)
# Alvo: OWASP Juice Shop 20.2.0 em http://localhost:3000 (local, autorizado)
env:
  contexts:
    - name: juice-shop
      urls:
        - "http://localhost:3000"
      includePaths:
        - "http://localhost:3000.*"
      excludePaths:
        - "http://localhost:3000/socket.io.*"
        - "http://localhost:3000/.*\\.(png|jpg|jpeg|gif|svg|ico|woff2?|ttf|mp4)$"
  parameters:
    failOnError: false
    failOnWarning: false
    progressToStdout: true

jobs:
  - type: passiveScan-config
    parameters:
      maxAlertsPerRule: 10
      scanOnlyInScope: true

  - type: spider
    parameters:
      context: juice-shop
      url: "http://localhost:3000"
      maxDuration: 5
      maxDepth: 8
      numberOfThreads: 5

  - type: spiderAjax
    parameters:
      context: juice-shop
      url: "http://localhost:3000"
      maxDuration: 6
      maxCrawlDepth: 6
      numberOfBrowsers: 2
      browserId: edge-headless

  - type: passiveScan-wait
    parameters:
      maxDuration: 5

  - type: activeScan
    parameters:
      context: juice-shop
      maxRuleDurationInMins: 2
      maxScanDurationInMins: 20
      threadPerHost: 5

  - type: report
    parameters:
      template: traditional-html
      reportDir: "C:/tmp/zap-out"
      reportFile: "relatorio-zap-juiceshop"
      reportTitle: "Etapa 5 - Verificacao de Vulnerabilidades (OWASP ZAP / Juice Shop)"
      reportDescription: "Sessao unica de verificacao conduzida para a Etapa 5 do trabalho de Engenharia de Software Seguro."

  - type: report
    parameters:
      template: traditional-json
      reportDir: "C:/tmp/zap-out"
      reportFile: "relatorio-zap-juiceshop"

  - type: report
    parameters:
      template: risk-confidence-html
      reportDir: "C:/tmp/zap-out"
      reportFile: "relatorio-zap-juiceshop-risco-confianca"
